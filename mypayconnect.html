<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP PAGE</title>
</head>
<body>
    <h1>Create your account</h1>
    <p>Sign up with your phone and email to get started</p>
    <form action=""></form>
    <label for="">First Name</label><br>
    <input type="text" placeholder="John"><br>
    <label for="">Last Name(Surname)</label><br>
    <input type="text" placeholder="Surname"><br>
    <label for="">Middle Name <em>(optional)</em></label><br>
    <input type="text" placeholder="Middle name"><br>
    <label for="">Your Email Address</label><br>
    <input type="text" placeholder="Enter Email Address"><br>
    <label for="">Your Phone Number</label><br>
    <input type="tel" placeholder="Enter Phone Number"><br>
    <label for="password">Password</label><br>
    <input type="password" id="password" placeholder="Enter Password">
    <p>Use at least 8 characters,including a special character like "@","#"or"$"</p>
    <label for="">Referral Code <em>(optional)</em></label><br>
    <input type="text" placeholder="Enter referral code"><br>
    <button>Continue</button>
    <p>Already have an account?<a href="Sign in">Sign in</a></p>




    
</body>
</html>
